<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>멈춰라! 각도기</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100svh;display:grid;place-items:center;background:#101827;color:#f1f5ff;font-family:system-ui,sans-serif;padding:24px}main{width:min(860px,100%);text-align:center}.tag{color:#73dfd1;letter-spacing:.2em;font-size:12px;font-weight:700}h1{font-size:clamp(30px,6vw,48px);margin:14px 0}p{color:#aebbd0;line-height:1.8}.card{margin-top:30px;background:#19253a;border:1px solid #33425c;border-radius:24px;padding:24px 14px}svg{width:100%;height:auto;display:block;overflow:visible}text{font-family:system-ui,sans-serif}.readout{font-size:clamp(48px,10vw,80px);font-weight:800;font-variant-numeric:tabular-nums;min-height:1.3em;color:#73dfd1}.hint{min-height:28px;margin:4px 0 20px}button{background:#73dfd1;color:#102b32;border:0;border-radius:12px;padding:16px 32px;font-size:18px;font-weight:750;cursor:pointer;min-width:200px}button:hover{background:#9beee4}button:focus-visible{outline:3px solid white;outline-offset:5px}kbd{border:1px solid #65758e;border-radius:5px;padding:3px 9px;color:#e5edff;font:inherit}.foot{font-size:13px;margin-top:24px}@media(prefers-reduced-motion:reduce){.foot::after{content:' 자동 움직임은 버튼을 눌러 시작하세요.'}}
</style>
</head>
<body><main>
<div class="tag">ANGLE STOP GAME</div><h1>멈춰라! 각도기</h1>
<p>움직이는 바늘을 원하는 순간에 멈춰 보세요.<br><kbd>Space</kbd>를 누르거나 아래 버튼을 터치하세요.</p>
<div class="card">
<svg viewBox="0 0 720 390" role="img" aria-label="왼쪽 0도에서 오른쪽 180도까지 바늘이 움직이는 각도기">
<path d="M60 330 A300 300 0 0 1 660 330 Z" fill="#21334c" stroke="#91a7c6" stroke-width="2"/>
<path d="M110 330 A250 250 0 0 1 610 330" fill="none" stroke="#415773" stroke-width="1"/>

<path id="sector" fill="#73dfd1" opacity=".13"/>
<line x1="360" y1="330" x2="60" y2="330" stroke="#73dfd1" stroke-width="3"/>
<g id="needle"><line x1="360" y1="330" x2="643" y2="330" stroke="#ffbd7b" stroke-width="5" stroke-linecap="round"/><circle cx="643" cy="330" r="7" fill="#ffbd7b"/></g>
<circle cx="360" cy="330" r="11" fill="#f1f5ff"/><circle cx="360" cy="330" r="5" fill="#19253a"/>
<text x="360" y="373" text-anchor="middle" fill="#aebbd0" font-size="14">왼쪽부터 시작 · 멈추면 각도 공개</text>
</svg>
<div class="readout" id="angle">움직이는 중</div>
<p class="hint" id="status" role="status" aria-live="polite">스페이스바로 멈춰 보세요!</p>
<button id="toggle" type="button" aria-pressed="false">멈추기</button>
</div><p class="foot">0°부터 180°까지 왕복합니다. 멈춘 각도는 1° 단위로 표시됩니다.</p>
</main>
<script>
'use strict';
function point(deg,r){const a=(180-deg)*Math.PI/180;return [360+r*Math.cos(a),330-r*Math.sin(a)];}
const needle=document.getElementById('needle'),sector=document.getElementById('sector'),readout=document.getElementById('angle'),status=document.getElementById('status'),button=document.getElementById('toggle');
let running=!matchMedia('(prefers-reduced-motion: reduce)').matches,angle=0,phase=Math.random()*360,speed=50+Math.random()*60,lastTime=null;
function draw(){needle.setAttribute('transform',`rotate(${angle-180} 360 330)`);const [x,y]=point(angle,95);sector.setAttribute('d',`M360 330 L265 330 A95 95 0 0 1 ${x} ${y} Z`);}
function update(){button.textContent=running?'멈추기':'다시 움직이기';button.setAttribute('aria-pressed',String(!running));readout.textContent=running?'움직이는 중':`${Math.round(angle)}°`;status.textContent=running?'스페이스바로 멈춰 보세요!':`멈춘 각도는 ${Math.round(angle)}도입니다. 다시 누르면 움직입니다.`;}
function toggle(){running=!running;lastTime=null;if(running){speed=50+Math.random()*60;}if(!running){angle=Math.round(angle);draw();}update();}
button.addEventListener('click',toggle);
document.addEventListener('keydown',event=>{if(event.code==='Space'){event.preventDefault();if(!event.repeat)toggle();}});
document.addEventListener('visibilitychange',()=>{lastTime=null;});
function frame(time){if(running){if(lastTime!==null){phase=(phase+Math.min((time-lastTime)/1000,.1)*speed)%360;angle=phase<=180?phase:360-phase;}lastTime=time;draw();}requestAnimationFrame(frame);}
angle=phase<=180?phase:360-phase;draw();update();requestAnimationFrame(frame);
</script></body></html>
