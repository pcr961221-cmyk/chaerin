const TIEBREAKERS={
 EI:{id:'tie-EI',axis:'EI',text:'새로운 동료와 공동 수업을 맡게 되었을 때, 첫 구상은 어떻게 시작하고 싶나요?',options:[{text:'가벼운 대화로 서로의 생각을 꺼내며 출발한다.',value:'E'},{text:'각자 생각할 시간을 가진 뒤 정리한 구상을 나눈다.',value:'I'}]},
 SN:{id:'tie-SN',axis:'SN',text:'학생 자치 공간을 새롭게 꾸민다면, 먼저 살피고 싶은 것은?',options:[{text:'실제 이용 인원, 가구 크기와 동선이다.',value:'S'},{text:'그 공간에서 생겨날 배움과 만남의 모습이다.',value:'N'}]},
 TF:{id:'tie-TF',axis:'TF',text:'동료의 새로운 제안을 검토하는 자리에서 먼저 건네고 싶은 말은?',options:[{text:'이 제안이 해결하는 문제와 판단 기준을 함께 정해 볼까요?',value:'T'},{text:'이 제안에 담긴 바람과 함께할 분들의 마음을 들어 볼까요?',value:'F'}]},
 JP:{id:'tie-JP',axis:'JP',text:'아무 일정이 없는 교내 자율 연수 오후가 주어지면?',options:[{text:'끝낼 목표와 순서를 정해 두고 시간을 보낸다.',value:'J'},{text:'그날 궁금해지는 주제를 따라 시간을 써 본다.',value:'P'}]}
};
function calculate(answers){
 const ratios={},ties=[];let type='';
 for(const axis of AXES){const qs=QUESTIONS.filter(q=>q.axis===axis);let first=0,second=0;
  for(const q of qs){const value=answers[q.id];if(value===axis[0])first++;else if(value===axis[1])second++;else return null;}
  if(first===second){const answer=answers[TIEBREAKERS[axis].id];if(!axis.includes(answer)||!answer){ties.push(axis);type+='?';}else{first+=answer===axis[0]?1:0;second+=answer===axis[1]?1:0;type+=answer;}}
  else type+=first>second?axis[0]:axis[1];
  ratios[axis]={first,second,total:first+second,percent:Math.round(first/(first+second)*100)};
 }
 return {type,ratios,ties};
}

['INFJ','마음을 읽는 상담 전문가','🌙','#eae4f2',['학생의 한마디 뒤에 긴 이야기가 보여요.','조용한 상담실에서 큰 변화가 시작되기도 해요.','오늘 수업의 진짜 질문은 마음에 남았나요?'],['말과 행동 너머 학생의 성장 방향을 헤아리는 일|반복되는 결석 뒤에 어떤 어려움이 있는지 시간을 두고 듣기','배움의 의미와 학생의 삶을 연결하는 수업|문학 속 선택을 자신의 경험과 연결하는 성찰 글쓰기 준비하기','소수의 동료와 깊이 있는 고민을 나누는 교무실 생활|수업 뒤 남은 학생 반응을 믿는 동료와 함께 해석하기','말하기 어려운 마음도 기다리며 듣는 지도|바로 결론을 내리기보다 학생이 자기 언어를 찾도록 기다리기','일의 목적을 떠올리며 긴 호흡으로 설계하는 업무|진로 프로그램을 학생의 성장 단계에 맞춰 엮기','눈앞의 반응과 장기적인 가능성을 함께 보는 힘|조용한 학생의 작은 시도를 발견해 다음 기회를 연결하기','다른 사람의 고민을 오래 품어 지치는 순간|상담 내용을 필요한 범위에서 전문 인력과 나누기','공동의 의미를 확인하며 방향을 맞추는 협업|행사를 시작하기 전 학생에게 남기고 싶은 경험을 함께 정하기']],
['INTJ','수업 설계 전략가','♟️','#e3e8f1',['이 수업에는 다 계획이 있습니다.','활동 하나에도 다음 차시의 복선이 있어요.','이 과정, 더 나은 구조로 바꿀 수 있겠는데요?'],['학교의 복잡한 일을 큰 구조로 파악하고 개선하는 일|평가와 수업의 연결이 끊긴 부분을 찾아 학기 흐름을 다시 그리기','도달할 목표부터 거꾸로 설계하는 수업|마지막 수행 과제에 필요한 사고 과정을 차시별로 배치하기','독립적으로 탐색한 생각을 핵심 중심으로 나누는 교무실 생활|새 평가 방법의 장단점을 정리해 필요한 회의에서 제안하기','학생이 스스로 판단할 전략을 찾도록 돕는 지도|성적 고민을 학습 습관과 환경으로 나누어 점검하기','중복되는 과정을 줄이고 우선순위를 정하는 업무|여러 양식에 반복 입력하는 항목을 찾아 통합안을 제안하기','멀리 보는 설계와 문제의 핵심을 찾는 힘|행사 직전보다 기획 단계에서 생길 병목을 미리 살피기','명확한 결론이 상대에게 차갑게 들리는 순간|대안을 말하기 전 동료가 들인 노력과 걱정을 확인하기','자율성과 전문성을 존중하며 목표를 공유하는 협업|최종 기준을 합의하고 각자의 방법에는 재량을 주기']],
['ISTP','위기 해결 만능 해결사','🛠️','#e2eceb',['프로젝터가 안 켜져요? 잠깐 볼게요.','설명서보다 직접 해 보면 빨리 알 때도 있어요.','갑작스러운 변수요? 일단 상황부터 볼까요.'],['현장의 조건을 차분히 읽고 필요한 조치를 찾는 일|기기가 멈춘 수업에서 원인을 살피고 대체 도구를 꺼내기','직접 만지고 시험하며 원리를 확인하는 수업|실험 결과가 달라진 이유를 학생과 재료부터 점검하기','필요할 때 간결하게 도움을 주는 교무실 생활|자료 출력이 막힌 동료에게 해결 순서를 짧게 보여 주기','감정을 가라앉히고 실제로 바꿀 행동을 찾는 지도|다툼이 있던 자리의 상황을 재구성해 다른 행동을 연습하기','불필요한 단계를 줄이고 즉시 실행하는 업무|현장에서 자주 쓰는 도구를 접근하기 쉽게 재배치하기','예상 밖 상황에서도 침착하게 작동 원리를 찾는 힘|체육대회 장비 문제를 작은 대안으로 빠르게 해결하기','말없이 처리해 주변이 진행 상황을 모르는 순간|조치한 내용과 남은 위험을 짧게 공유하기','실질적인 역할을 맡고 서로의 재량을 지키는 협업|준비물을 직접 시험한 뒤 팀에 사용 방법을 전달하기']],
['ISFP','조용한 공감형 선생님','🎨','#f2e4dc',['말보다 따뜻한 눈빛이 먼저 도착해요.','우리 교실, 작은 색 하나로 달라질 수 있어요.','오늘은 그 아이의 속도로 걸어 볼게요.'],['학생 한 사람의 감각과 마음을 존중하는 일|교실이 소란스러울 때 힘든 학생에게 조용한 자리를 제안하기','직접 느끼고 표현할 수 있는 경험을 만드는 수업|같은 주제를 글과 그림 중 편한 방식으로 표현하게 하기','부드럽게 곁을 지키며 관계를 만드는 교무실 생활|지친 동료에게 긴 조언 대신 차 한 잔을 건네기','학생의 개성을 지켜 주며 현실적인 선택을 돕는 지도|발표가 부담스러운 학생과 다른 참여 방식을 의논하기','현장의 필요에 맞춰 정성을 담는 업무|학생이 실제로 사용하는 게시물의 색과 글씨 크기를 바꾸기','작은 불편과 개별적인 표현을 알아보는 힘|말없이 수업을 따라오던 학생의 작업에서 변화를 발견하기','갈등을 피하다 자신의 필요를 미루는 순간|동료의 부탁을 듣고 가능한 범위를 먼저 말하기','각자의 방식이 살아 있도록 세심하게 조율하는 협업|행사 공간을 꾸밀 때 팀원의 다른 감각을 한 부분씩 반영하기']],
['INFP','학생의 가능성을 발견하는 선생님','🌱','#e9eddc',['아직 피지 않은 가능성도 출석 중이에요.','학생의 엉뚱한 질문에 오래 머물고 싶어요.','잘하는 것보다 좋아하는 이유가 먼저 궁금해요.'],['지금의 성적 너머 학생이 품은 가치를 발견하는 일|잘 드러나지 않던 관심사를 진로 이야기의 출발점으로 삼기','개인의 경험과 상상을 배움으로 연결하는 수업|정답을 찾은 뒤에도 자신만의 해석을 적을 시간을 주기','진심이 통하는 대화를 소중히 여기는 교무실 생활|새로 온 동료가 느끼는 낯섦을 조용히 물어보기','학생의 선택과 마음을 존중하며 가능성을 찾는 지도|실수한 학생에게 어떤 사람이 되고 싶은지 함께 묻기','일의 의미가 보일 때 깊이 몰입하는 업무|학생 목소리를 담은 행사 소개 글을 정성껏 구성하기','남들이 놓친 독특한 강점에 언어를 붙이는 힘|조용한 학생의 글 속 관점을 발견해 구체적으로 격려하기','원하는 모습과 현실의 차이에 지치는 순간|이번 주에 실천할 수 있는 작은 변화 하나로 목표를 나누기','다른 의견 속 가치와 의도를 찾아 연결하는 협업|제안이 갈릴 때 각자가 지키려는 의미를 먼저 정리하기']],

const TYPES=Object.fromEntries(profiles.map(([type,nickname,icon,color,quotes,seeds])=>[type,{type,nickname,icon,color,quotes,analysis:seeds.map((seed,i)=>{const [style,example]=seed.split('|');const first=i===5?`${style}이 나의 자원이 될 수 있어요.`:i===6?`${style}이 있을 수 있어요.`:`${style}에 편안함을 느낄 수 있어요.`;const second=i===6?`이때는 ‘${example}’부터 시작해 보세요.`:`예를 들어 ‘${example}’라는 장면에서 이런 성향이 드러날 수 있습니다.`;return `${first} ${second} ${frames[i].join(' ')}`;})}]));
function comparison(usual,school){if(!TYPES[usual])return null;const changed=AXES.map((a,i)=>usual[i]!==school[i]?`${AXIS_LABELS[usual[i]]}(${usual[i]}) → ${AXIS_LABELS[school[i]]}(${school[i]})`:null).filter(Boolean);return changed.length?`학교생활 응답에서 ${changed.join(', ')} 지표가 다르게 나타났어요. 역할과 상황에 따라 사용하는 방식이 달라질 수 있으며 성격이 바뀌었다는 뜻은 아닙니다.`:'평소의 성향과 학교생활 응답이 비슷하게 나타났어요. 같은 유형 안에서도 행동과 경험에는 다양한 차이가 있습니다.';}

// 공용 게시판: 익명 로그인 후 같은 프로젝트의 게시판을 자동 구독합니다.
class SharedBackend {
 constructor(){this.user=null;this.entries=[];this.myVotes={};this.stops=[];this.stopComments=null;this.onChange=()=>{};this.onError=()=>{};this.ready=false;}
 async init(config){
  if(!config?.projectId||!config?.apiKey||config.projectId.includes('YOUR_'))return false;
  const root='https://www.gstatic.com/firebasejs/11.10.0/';
  const [app,auth,db]=await Promise.all([import(root+'firebase-app.js'),import(root+'firebase-auth.js'),import(root+'firebase-firestore.js')]);
  this.f=db;const application=app.initializeApp(config);this.auth=auth.getAuth(application);this.db=db.getFirestore(application);
  if(window.FIREBASE_EMULATORS){const e=window.FIREBASE_EMULATORS;auth.connectAuthEmulator(this.auth,`http://${e.host}:${e.authPort}`,{disableWarnings:true});db.connectFirestoreEmulator(this.db,e.host,e.firestorePort);}
  await auth.setPersistence(this.auth,auth.browserLocalPersistence);
  this.user=(await auth.signInAnonymously(this.auth)).user;
  await this.watch();return true;
 }
 ref(...path){return this.f.doc(this.db,...path);}
 resultRef(uid=this.user.uid){return this.ref('schoolResults',uid);}
 voteRef(target){return this.ref('schoolVotes',this.user.uid,'targets',target);}
 async watch(){
  this.stop();const f=this.f;let first=true;
  await new Promise((resolve,reject)=>{
   this.stops.push(f.onSnapshot(f.collection(this.db,'schoolResults'),{includeMetadataChanges:true},snap=>{this.entries=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.createdAt?.toMillis()||0)-(a.createdAt?.toMillis()||0));this.ready=!snap.metadata.fromCache;this.onChange();if(first&&!snap.metadata.fromCache){first=false;resolve();}},e=>{this.ready=false;this.onError(e);if(first){first=false;reject(e);}}));
  });
  this.stops.push(f.onSnapshot(f.collection(this.db,'schoolVotes',this.user.uid,'targets'),snap=>{this.myVotes=Object.fromEntries(snap.docs.map(d=>[d.id,d.data()]));this.onChange();},e=>this.onError(e)));
 }
 stop(){this.stops.forEach(fn=>fn());this.stops=[];this.stopComments?.();this.stopComments=null;this.ready=false;}
 async share(summary){const f=this.f,ref=this.resultRef();await f.runTransaction(this.db,async tx=>{const old=await tx.get(ref),payload={...summary,uid:this.user.uid,updatedAt:f.serverTimestamp()};if(old.exists())tx.update(ref,payload);else tx.set(ref,{...payload,createdAt:f.serverTimestamp(),epoch:crypto.randomUUID(),similar:0,different:0});});}
 async rename(name){await this.f.updateDoc(this.resultRef(),{name,updatedAt:this.f.serverTimestamp()});}
 async removeOwn(){await this.removeResult(this.user.uid);}
 async removeResult(target){await this.f.deleteDoc(this.resultRef(target));}
 async vote(target,choice){
  if(target===this.user.uid)throw new Error('본인의 결과에는 투표할 수 없어요.');
  if(!['similar','different'].includes(choice))throw new Error('투표 선택을 확인해 주세요.');
  const f=this.f,ref=this.resultRef(target),ballot=this.voteRef(target);
  await f.runTransaction(this.db,async tx=>{const [r,v]=await Promise.all([tx.get(ref),tx.get(ballot)]);if(!r.exists())throw new Error('삭제된 결과입니다.');const row=r.data(),old=v.exists()&&v.data().epoch===row.epoch?v.data().choice:null;if(old===choice)return;const counts={similar:row.similar,different:row.different};if(old)counts[old]--;counts[choice]++;tx.set(ballot,{choice,epoch:row.epoch,target});tx.update(ref,counts);});
 }
 commentsRef(target){return this.f.collection(this.db,'schoolResults',target,'comments');}
 watchComments(target,epoch,callback){this.stopComments?.();const f=this.f;this.stopComments=f.onSnapshot(f.query(this.commentsRef(target),f.where('epoch','==',epoch)),snap=>callback(snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.createdAt?.toMillis()||0)-(b.createdAt?.toMillis()||0))),e=>this.onError(e));}
 async addComment(target,epoch,name,text){const f=this.f;await f.addDoc(this.commentsRef(target),{uid:this.user.uid,name,text,epoch,createdAt:f.serverTimestamp(),updatedAt:f.serverTimestamp()});}
 async editComment(target,id,name,text){await this.f.updateDoc(this.ref('schoolResults',target,'comments',id),{name,text,updatedAt:this.f.serverTimestamp()});}
 async deleteComment(target,id){await this.f.deleteDoc(this.ref('schoolResults',target,'comments',id));}
}

const KEY='teacher-mbti-v1';let state={usual:'unknown',answers:{},index:0,started:false,quoteIndex:0};let online=false,search='',filter='',toastTimer,busy=false;
const safeRead=k=>{try{return JSON.parse(localStorage.getItem(k));}catch{return null;}};
const restored=safeRead(KEY);
if(restored&&typeof restored==='object'){
 state.usual=TYPES[restored.usual]?restored.usual:'unknown';state.started=!!restored.started;state.quoteIndex=Number.isInteger(restored.quoteIndex)?Math.abs(restored.quoteIndex)%3:0;
 for(const q of [...QUESTIONS,...Object.values(TIEBREAKERS)])if(q.options.some(o=>o.value===restored.answers?.[q.id]))state.answers[q.id]=restored.answers[q.id];
 state.index=Number.isInteger(restored.index)?Math.max(0,Math.min(restored.index,51)):0;
}

function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function toast(text){$('#toast').textContent=text;$('#toast').classList.add('visible');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('#toast').classList.remove('visible'),5000);}
function message(error){const code=error?.code||'';if(code.includes('operation-not-allowed'))return 'Firebase Console → Authentication → 로그인 방법에서 익명 로그인을 사용 설정해 주세요.';if(code.includes('api-key-not-valid')||code.includes('invalid-api-key'))return 'Firebase 공개 API 키와 프로젝트 설정을 확인해 주세요.';if(code.includes('unauthorized-domain'))return 'Firebase Authentication 설정의 승인된 도메인에 현재 웹사이트 호스트를 추가해 주세요.';if(code.includes('permission-denied'))return '결과 댓글 접근이 거부되었습니다. Firebase Console에 최신 결과 댓글용 firestore.rules를 게시했는지 확인해 주세요.';if(code.includes('unavailable')||code.includes('network'))return '네트워크 연결을 확인한 뒤 다시 시도해 주세요.';return error?.message||'요청을 처리하지 못했어요. 다시 시도해 주세요.';}

function home(){app.innerHTML=`<section class="hero"><div><span class="pill">🌿 선생님을 위한 작은 자기 발견</span><h1>학교에서의 나는<br>어떤 <em>MBTI</em>일까?</h1><p>평소의 나와 학교에서의 나는 같을까요?<br>교실 속 나의 모습을 발견하고,<br>함께하는 선생님들과 다름을 나눠 보세요.</p><div class="hero-actions"><a class="btn primary" href="#start">나의 학교 MBTI 검사하기 <span>↗</span></a><a class="text-btn" href="#types">유형 먼저 둘러보기 →</a></div><p class="caption">48개의 학교생활 질문 · 약 8–12분 · 이름 없이 시작해요</p></div>${illustration}</section><section><div class="section-top"><h2>나를 알고, 우리를 이해하는 시간</h2><span class="small-text muted">다른 모습도, 같은 마음도 괜찮아요.</span></div><div class="cards"><a href="#start" class="card feature"><span class="arrow">↗</span><span class="icon" style="background:var(--mint)">✏️</span><h3>나의 학교 MBTI 검사하기</h3><p>수업부터 교무실 생활까지,<br>학교에서 자연스러운 나를 만나 보세요.</p></a><a href="#result" class="card feature"><span class="arrow">↗</span><span class="icon" style="background:var(--pink)">💬</span><h3>선생님들의 결과 댓글</h3><p>동료의 새로운 모습을 발견하고<br>가벼운 공감 한 표를 나눠 보세요.</p></a><a href="#types" class="card feature"><span class="arrow">↗</span><span class="icon" style="background:var(--purple)">🧩</span><h3>학교생활 MBTI 유형 알아보기</h3><p>16가지 다채로운 선생님 이야기,<br>어떤 모습이 나와 닮았을까요?</p></a></div></section><section class="room-strip"><div><h3>🏫 같은 사이트에서, 서로의 새로운 모습을 만나요</h3><p>${online?'공유에 동의한 결과는 모든 접속자에게 실시간으로 보입니다.':'Firebase 연결 후 결과 공유·댓글·공감 투표를 사용할 수 있어요.'}</p></div><div class="room-actions"><a class="btn small primary" href="#result">선생님들의 결과 댓글 →</a></div></section><p class="info">ⓘ 이 검사는 공식 MBTI 검사가 아닙니다. 교사로서의 나를 돌아보고 서로를 이해하기 위한 활동이며, 성격이나 교사의 역량을 판단하는 자료가 아닙니다.</p>`;}
function start(){app.innerHTML=`<div class="narrow">${head('BEFORE WE BEGIN','먼저, 평소의 나는?','평소 알고 있는 MBTI를 골라 주세요. 학교에서의 모습과 비교해 드릴게요.')}<div class="card"><span class="section-tag">이름은 공유할 때만 입력해요</span><div class="type-select" role="group" aria-label="평소 MBTI 선택">${[...Object.keys(TYPES),'unknown'].map(t=>`<button class="choice-type ${state.usual===t?'selected':''}" data-usual="${t}" aria-pressed="${state.usual===t}">${t==='unknown'?'잘 모르겠어요':t}</button>`).join('')}</div><p class="muted small-text">두 선택지 모두 자연스러운 학교생활 방식입니다. 더 좋은 답보다 평소 내 모습에 가까운 쪽을 선택해 주세요.</p><div class="stack"><button class="btn primary" data-action="begin">${state.started?'이어서 검사하기':'48문항 검사 시작하기'} →</button>${Object.keys(state.answers).length?'<button class="text-btn" data-action="restart">답변을 지우고 처음부터 시작</button>':''}</div></div><p class="info">진행 상황과 응답은 이 브라우저에만 저장됩니다. 공용 기기에서는 사용 후 ‘이 기기의 검사 기록 지우기’를 눌러 주세요.</p></div>`;}
function quiz(){if(!state.started){go('#start');return;}const result=calculate(state.answers);const tiedAxes=AXES.filter(axis=>{const a=QUESTIONS.filter(q=>q.axis===axis);return a.every(q=>state.answers[q.id])&&a.filter(q=>state.answers[q.id]===axis[0]).length===6;});const sequence=[...QUESTIONS,...tiedAxes.map(a=>TIEBREAKERS[a])];state.index=Math.min(state.index,sequence.length-1);const q=sequence[state.index];const answered=sequence.filter(q=>state.answers[q.id]).length;app.innerHTML=`<div class="narrow"><div class="section-top"><a class="text-btn" href="#home">← 홈으로</a><span class="small-text muted">자동 저장 · 언제든 이어서 할 수 있어요</span></div><div class="progress-meta"><span>${state.index>=48?'동점 지표 추가 질문':'나의 학교생활 탐색'}</span><strong>${state.index+1} / ${sequence.length}</strong></div><div class="progress" role="progressbar" aria-label="응답 진행률" aria-valuemin="0" aria-valuemax="${sequence.length}" aria-valuenow="${answered}"><span style="width:${answered/sequence.length*100}%"></span></div><section class="card quiz-card"><span class="section-tag">${state.index>=48?'조금 더 나다운 쪽을 골라 주세요':'평소 학교에서의 나를 떠올려 보세요'}</span><h2 id="question-title" tabindex="-1">${esc(q.text)}</h2><div class="answers" role="group" aria-labelledby="question-title">${q.options.map((o,i)=>`<button class="answer ${state.answers[q.id]===o.value?'selected':''}" data-answer="${o.value}" data-question="${q.id}" aria-pressed="${state.answers[q.id]===o.value}"><b>${i?'B':'A'}</b><span>${esc(o.text)}</span></button>`).join('')}</div></section><div class="quiz-nav"><button class="btn" data-action="previous" ${state.index===0?'disabled':''}>← 이전 문항</button><button class="btn primary" data-action="next" ${!state.answers[q.id]?'disabled':''}>${state.index===sequence.length-1?(result?.ties.length?'추가 질문으로 →':'결과 확인하기 →'):'다음 문항 →'}</button></div><p class="small-text muted center">선택 후 다음 문항으로 이동해 주세요. 이전 답변도 수정할 수 있어요.</p></div>`;}
function analysisHtml(type){const p=TYPES[type];return `<div class="section-top"><h2>학교생활 속 ${type}, 조금 더 자세히</h2><span class="small-text muted">나의 경험과 비교하며 읽어 보세요.</span></div><div class="analysis-grid">${p.analysis.map((text,i)=>`<section class="card"><h3><span class="muted">0${i+1}</span> ${HEADINGS[i]}</h3><p>${text}</p></section>`).join('')}</div>`;}
function resultHero(type,quote){const p=TYPES[type];return `<section class="result-hero" style="background:linear-gradient(135deg,${p.color},#faf8ef)"><span class="pill">나의 학교생활 탐색 결과</span><div class="result-symbol">${p.icon}</div><div class="type-large">${type}</div><h1>${p.nickname}</h1><p class="quote">“${esc(quote)}”</p></section>`;}
function inlineResultSharing(r){return `<section id="result-sharing" class="inline-result-sharing"><div class="section-top"><h2>💬 내 결과를 댓글로 공유하기</h2><span class="small-text muted">결과가 자동으로 등록돼요</span></div>${r?`<div class="card" id="automatic-result-share"><div class="comment-types"><span class="pill">평소 MBTI <b>${TYPES[state.usual]?state.usual:'잘 모르겠어요'}</b></span><span>→</span><span class="pill" style="background:${TYPES[r.type].color}">학교 MBTI <b>${r.type}</b></span></div><p><strong>학교에서의 성향 · ${TYPES[r.type].nickname}</strong></p><p class="muted small-text">공유하기를 누르면 위 결과와 학교생활 공감 문구가 아래 댓글에 자동으로 올라갑니다. 댓글 내용을 직접 작성할 필요가 없어요.</p><button type="button" data-action="automatic-share" class="btn primary" ${!online?'disabled':''}>내 결과 공유하기 ↗</button><p class="muted small-text">이름·별명과 요약 결과가 모든 이용자에게 공개됩니다. 처음 공유할 때만 이름과 공개 동의를 확인합니다. 다시 누르면 내 기존 결과가 갱신됩니다.</p></div>`:'<p class="info">검사를 완료하면 내 결과를 버튼 한 번으로 댓글에 공유할 수 있어요.</p>'}${!online?'<p class="muted small-text">Firebase 연결 전에는 실시간 결과 공유가 불가능합니다. 개인 검사는 그대로 이용할 수 있어요.</p>':''}<div class="section-top"><h3>선생님들의 결과 댓글 <span id="result-comment-count" class="muted">${online?backend.entries.length:0}</span></h3></div><div id="result-comment-list" class="comment-list" aria-live="polite"></div></section>`;}
function resultCommentRow(row){const p=TYPES[row.type];if(!p)return '';const mine=row.uid===backend.user?.uid,ballot=backend.myVotes[row.uid],choice=ballot?.epoch===row.epoch?ballot.choice:null;return `<article class="comment-entry result-comment" data-result-uid="${esc(row.uid)}"><div class="comment-avatar" style="background:${p.color}">${p.icon}</div><div class="comment-body"><div class="comment-heading"><strong>${esc(row.name)}</strong><small class="muted">${mine?'내 결과 · ':''}${row.updatedAt?.toDate?esc(row.updatedAt.toDate().toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})):'저장 중…'}</small><button type="button" class="comment-trash" data-action="delete-result-comment" data-target="${esc(row.uid)}" aria-label="이 결과 댓글 삭제" title="댓글 삭제">🗑️</button></div><div class="comment-types"><span class="pill">평소 <b>${TYPES[row.usual]?row.usual:'잘 모르겠어요'}</b></span><span>→</span><span class="pill" style="background:${p.color}">학교 <b>${row.type}</b></span></div><strong>학교에서의 성향 · ${p.nickname}</strong><p class="quote">“${esc(row.quote)}”</p>${row.comment?`<p class="comment-text">${esc(row.comment)}</p>`:''}<div class="inline-votes">${[['similar','👍 비슷해요'],['different','🤔 아닌 것 같아요']].map(([value,label])=>`<button class="vote-btn ${choice===value?'chosen':''}" data-vote="${value}" data-target="${esc(row.uid)}" aria-pressed="${choice===value}" ${mine?'disabled':''}>${label} <b>${row[value]}표</b></button>`).join('')}<button class="text-btn" data-action="open-comments" data-target="${esc(row.uid)}">답글 보기 · 쓰기</button>${mine?'<button class="text-btn" data-action="edit-own">이름 수정</button>':''}</div></div></article>`;}
function updateResultComments(){const list=$('#result-comment-list');if(!list)return;list.innerHTML=online?(backend.entries.length?backend.entries.map(resultCommentRow).join(''):'<p class="muted">아직 등록된 결과 댓글이 없어요. 첫 이야기를 남겨 보세요.</p>'):'<p class="muted">연결 후 다른 선생님들의 결과 댓글이 여기에 표시됩니다.</p>';$('#result-comment-count').textContent=online?backend.entries.length:0;}
function bindResultSharing(){updateResultComments();}
function shareAutomaticResult(button){if(!needOnline())return;const r=calculate(state.answers);if(!r||r.ties.length){toast('먼저 검사를 완료해 주세요.');return;}const p=TYPES[r.type];const publish=async name=>{await backend.share({name,comment:'',usual:state.usual,type:r.type,nickname:p.nickname,quote:p.quotes[state.quoteIndex]});updateResultComments();toast('평소 MBTI와 학교 MBTI 결과를 댓글로 공유했어요.');const row=[...($('#result-comment-list')?.children||[])].find(el=>el.dataset.resultUid===backend.user.uid);row?.scrollIntoView({behavior:'smooth',block:'center'});};const own=backend.entries.find(row=>row.uid===backend.user.uid);if(own?.name){action(()=>publish(own.name),button);return;}modal(`<h2>내 결과 공유하기</h2><p>평소 MBTI ${TYPES[state.usual]?state.usual:'잘 모르겠어요'} → 학교 MBTI ${r.type}<br>학교에서의 성향 · ${p.nickname}</p><form id="auto-share-identity"><label class="form-field">처음 한 번, 이름 또는 별명을 알려 주세요.<input name="name" required maxlength="24" placeholder="예: 수학쌤, 3학년 담임" autocomplete="off"></label><label class="consent"><input type="checkbox" name="consent" required><span>이름·별명과 MBTI 요약 결과가 모든 이용자에게 공개되는 데 동의합니다.</span></label><p class="muted small-text">결과 내용은 자동으로 등록됩니다. 상세 문항별 응답은 공개하지 않습니다.</p><p id="modal-error" class="error" role="alert"></p><button type="submit" class="btn primary">내 결과 공유하기 →</button></form>`);$('#auto-share-identity').onsubmit=e=>{e.preventDefault();const form=e.target,name=form.elements.name.value.trim();if(!name||name.length>24||!form.elements.consent.checked){errorBox('이름과 공개 동의를 확인해 주세요.');return;}action(async()=>{await publish(name);$('#modal').close();},e.submitter);};}
function result(){const r=calculate(state.answers);if(!r||r.ties.length){app.innerHTML=`${head('MY RESULT','아직 탐색 중이에요','48문항과 동점 추가 질문에 답하면 결과를 확인할 수 있습니다.')}<a class="btn primary" href="#quiz">검사 이어서 하기 →</a>${inlineResultSharing(null)}`;bindResultSharing(null);return;}const p=TYPES[r.type];const compare=comparison(state.usual,r.type);app.innerHTML=`${head('A LITTLE DISCOVERY','학교에서 발견한 새로운 나','결과는 지금의 응답을 바탕으로 한 참고 자료입니다. 나와 닮은 점, 다른 점을 찾아보세요.')}${resultHero(r.type,p.quotes[state.quoteIndex])}<div class="result-grid"><section class="card"><h2>네 가지 지표 살펴보기</h2>${AXES.map(a=>{const v=r.ratios[a];return `<div class="axis"><div class="axis-labels"><span>${a[0]} ${AXIS_LABELS[a[0]]} <b>${v.percent}%</b></span><span><b>${100-v.percent}%</b> ${AXIS_LABELS[a[1]]} ${a[1]}</span></div><div class="axis-track"><span style="width:${v.percent}%"></span></div><small class="muted">${v.first} : ${v.second} 응답${v.total===13?' · 동점 추가 질문 포함':''}</small></div>`;}).join('')}<p class="small-text muted">비율은 문항 선택의 비율이며 성격의 강도나 정확도를 뜻하지 않습니다.</p></section><section class="card"><h2>평소의 나와 비교하면?</h2>${compare?`<div class="comparison"><div><small>평소 MBTI</small><strong>${state.usual}</strong></div><span>→</span><div><small>학교 MBTI</small><strong>${r.type}</strong></div></div><p class="muted">${compare}</p>`:'<p class="muted">평소 MBTI를 모른다고 선택하셨어요. 비교 대신 학교에서 자연스럽게 사용하는 방식을 살펴보세요.</p>'}<p class="info">유형은 사람을 고정하는 이름표가 아니에요. 오늘의 나를 이해하는 작은 대화의 출발점으로 활용해 주세요.</p><button class="text-btn" data-action="print">결과 인쇄 / PDF 저장</button></section></div>${inlineResultSharing(r)}${analysisHtml(r.type)}`;bindResultSharing(r);}
function types(){app.innerHTML=`${head('16 WAYS TO BE A TEACHER','모두 다른 우리, 함께하는 교무실','정답인 유형은 없어요. 16가지 선생님 이야기를 천천히 만나 보세요.')}<div class="type-grid">${Object.values(TYPES).map(p=>`<a class="card type-card" style="background:${p.color}" href="#type/${p.type}"><span class="emoji">${p.icon}</span><strong>${p.type}</strong><h3>${p.nickname}</h3><p>“${p.quotes[0]}”</p><span class="small-text">학교생활 이야기 읽기 ↗</span></a>`).join('')}</div>`;}
function typeDetail(type){if(!TYPES[type]){go('#types');return;}app.innerHTML=`<div class="section-top"><a class="text-btn" href="#types">← 16가지 유형</a><a class="btn small" href="#start">나는 어떤 유형일까? →</a></div>${resultHero(type,TYPES[type].quotes[0])}<p class="info">유형 소개 페이지입니다. 개인 검사 결과가 아니며, 아래 내용은 성향을 돌아보는 참고 자료입니다.</p><div class="card" style="margin-top:20px">${TYPES[type].quotes.map(q=>`<p class="quote">“${q}”</p>`).join('')}</div>${analysisHtml(type)}`;}
function stats(){const rows=backend.entries,known=rows.filter(r=>TYPES[r.usual]),same=known.filter(r=>r.usual===r.type).length,changed=known.length-same;const dist=Object.fromEntries(Object.keys(TYPES).map(t=>[t,rows.filter(r=>r.type===t).length]));const max=Math.max(0,...Object.values(dist));const most=max?Object.keys(dist).filter(t=>dist[t]===max).join(' · '):'아직 없어요';const shifts=AXES.map((a,i)=>({axis:a,count:known.filter(r=>r.usual[i]!==r.type[i]).length}));const high=Math.max(0,...shifts.map(x=>x.count));return {rows,known,same,changed,dist,most,shifts,shift:high?shifts.filter(x=>x.count===high).map(x=>x.axis.split('').join('/')).join(' · '):'변화 없음',similar:rows.reduce((s,r)=>s+r.similar,0),different:rows.reduce((s,r)=>s+r.different,0)};}
function statsCards(s){return `<div class="stats-row"><div class="stat"><small>결과를 공유한 선생님</small><strong>${s.rows.length}<small style="display:inline"> 명</small></strong></div><div class="stat"><small>가장 많이 나온 학교 MBTI · 공동 포함</small><strong style="font-size:20px">${s.most}</strong></div><div class="stat"><small>평소와 학교 유형이 다른 선생님</small><strong>${s.changed}<small style="display:inline"> 명</small></strong></div><div class="stat"><small>함께 나눈 공감</small><strong>${s.similar+s.different}<small style="display:inline"> 표</small></strong></div></div>`;}
function charts(s){return `<div class="charts"><section class="card"><h2>학교생활 MBTI 분포</h2>${Object.keys(TYPES).map(t=>`<div class="chart-bar"><span>${t}</span><div class="chart-track"><span style="width:${s.rows.length?s.dist[t]/s.rows.length*100:0}%" role="img" aria-label="${t} ${s.dist[t]}명"></span></div><b>${s.dist[t]}명</b></div>`).join('')}</section><section class="card"><h2>평소와 학교에서, 얼마나 닮았을까요?</h2><p class="muted small-text">평소 MBTI를 입력한 ${s.known.length}명 기준 · 모름 ${s.rows.length-s.known.length}명 제외</p>${[['같아요',s.same],['달라요',s.changed]].map(([label,n])=>`<div class="chart-bar"><span>${label}</span><div class="chart-track"><span style="width:${s.known.length?n/s.known.length*100:0}%"></span></div><b>${s.known.length?Math.round(n/s.known.length*100):0}%</b></div>`).join('')}<h3>가장 많이 달라진 지표</h3><p>${s.shift}</p>${s.shifts.map(({axis,count})=>`<div class="chart-bar"><span>${axis.split('').join('/')}</span><div class="chart-track"><span style="width:${s.known.length?count/s.known.length*100:0}%"></span></div><b>${count}명</b></div>`).join('')}<h3>전체 공감 투표</h3>${voteBars(s.similar,s.different)}<p class="info">공감은 가벼운 의견 나누기입니다. 교사에 대한 평가나 순위가 아니며, 결과 카드에는 순위가 표시되지 않습니다.</p></section></div>`;}
function voteBars(a,b){const total=a+b;return `<div class="vote-bars"><div><span style="width:${total?a/total*100:0}%"></span><span style="width:${total?b/total*100:0}%"></span></div><span>👍 비슷해요 ${a}표 (${total?Math.round(a/total*100):0}%) · 🤔 조금 달라요 ${b}표 (${total?Math.round(b/total*100):0}%)</span></div>`;}
function offlineBoard(){return `<div class="empty"><div class="big-icon">🏫</div><h2>결과 댓글 연결이 필요해요</h2><p>Firebase 연결에 실패해 현재 결과·댓글·투표를 불러올 수 없습니다.<br>개인 검사는 계속 이용할 수 있어요. 연결과 결과 댓글 보안 규칙을 확인하고 새로고침해 주세요.</p><a class="btn primary" href="#start">개인 검사하기 →</a></div>`;}

function statisticsPage(){const data=stats();app.classList.add('projector');app.innerHTML=`${head('LIVE CLASSROOM SNAPSHOT','우리 학교, 지금의 모습','선생님들의 결과 댓글을 바탕으로 한 실시간 통계')}${online?`${statsCards(data)}${charts(data)}`:offlineBoard()}<a class="btn" href="#result">결과 댓글로 돌아가기 →</a>`;}

let commentTarget=null,commentEpoch=null,threadRows=[];
$('#modal').addEventListener('close',()=>{backend.stopComments?.();backend.stopComments=null;commentTarget=null;commentEpoch=null;threadRows=[];});
function openComments(target){if(!needOnline())return;const result=backend.entries.find(r=>r.uid===target);if(!result){toast('삭제된 결과입니다.');return;}commentTarget=target;commentEpoch=result.epoch;threadRows=[];modal(`<h2>${esc(result.name)} 선생님의 결과에 댓글 남기기</h2><p>평소 ${TYPES[result.usual]?result.usual:'잘 모르겠어요'} → 학교 ${esc(result.type)} · ${esc(result.nickname)}</p><p class="small-text muted">댓글의 이름과 내용은 모든 이용자에게 공개됩니다. 실명 대신 별명을 사용하고 학생 정보는 적지 마세요.</p><div id="thread-list" class="thread-list" aria-live="polite">댓글을 불러오는 중…</div><form id="thread-form"><label class="form-field">이름 또는 별명<input name="name" required maxlength="24" autocomplete="off" value="${esc(backend.entries.find(r=>r.uid===backend.user.uid)?.name||'')}"></label><label class="form-field">댓글 내용<textarea name="text" required maxlength="500" rows="3" placeholder="평소와 학교에서의 다른 모습이 공감돼요!"></textarea></label><label class="consent"><input name="consent" type="checkbox" required><span>이름과 댓글을 결과 댓글에 공개하는 데 동의합니다.</span></label><p id="thread-error" class="error" role="alert"></p><button class="btn primary" type="submit">댓글 등록</button><button class="text-btn" type="button" id="cancel-edit" hidden>수정 취소</button></form>`);
 const form=$('#thread-form');const reset=()=>{delete form.dataset.editId;form.elements.text.value='';form.elements.consent.checked=false;form.querySelector('[type=submit]').textContent='댓글 등록';$('#cancel-edit').hidden=true;};$('#cancel-edit').onclick=reset;
 form.onsubmit=e=>{e.preventDefault();const name=form.elements.name.value.trim(),text=form.elements.text.value.trim(),id=form.dataset.editId;if(!name||name.length>24||!text||text.length>500||!form.elements.consent.checked){$('#thread-error').textContent='이름·댓글 내용·공개 동의를 확인해 주세요.';return;}action(async()=>{try{if(id)await backend.editComment(target,id,name,text);else await backend.addComment(target,result.epoch,name,text);reset();$('#thread-error').textContent='';toast(id?'댓글을 수정했어요.':'댓글을 등록했어요.');}catch(ex){$('#thread-error').textContent=message(ex);}},e.submitter);};
 $('#thread-list').onclick=e=>{const button=e.target.closest('button[data-comment]');if(!button)return;const row=threadRows.find(r=>r.id===button.dataset.comment);if(!row)return;if(button.dataset.operation==='edit'){if(row.uid!==backend.user.uid)return;form.dataset.editId=row.id;form.elements.name.value=row.name;form.elements.text.value=row.text;form.elements.consent.checked=false;form.querySelector('[type=submit]').textContent='댓글 수정 저장';$('#cancel-edit').hidden=false;form.elements.text.focus();}else{if(!window.confirm('이 댓글을 삭제하시겠습니까?'))return;action(async()=>{try{await backend.deleteComment(target,row.id);if(form.dataset.editId===row.id)reset();toast('댓글을 삭제했어요.');}catch(ex){$('#thread-error').textContent=message(ex);}},button);}};
 backend.watchComments(target,result.epoch,rows=>{threadRows=rows;const list=$('#thread-list');if(!list)return;list.innerHTML=rows.length?rows.map(row=>`<article class="thread-comment"><button type="button" class="comment-trash" data-comment="${esc(row.id)}" data-operation="delete" aria-label="이 답글 삭제" title="댓글 삭제">🗑️</button><strong>${esc(row.name)}</strong><small class="muted"> · ${row.updatedAt?.toDate?esc(row.updatedAt.toDate().toLocaleString('ko-KR',{timeZone:'Asia/Seoul'})):'저장 중…'}</small><p class="comment-text">${esc(row.text)}</p>${row.uid===backend.user.uid?`<button class="text-btn" data-comment="${esc(row.id)}" data-operation="edit">수정</button>`:''}</article>`).join(''):'<p class="muted">첫 댓글을 남겨 보세요.</p>';});
}

function render(){app.classList.remove('projector');const hash=location.hash||'#home';document.querySelectorAll('nav a').forEach(a=>{if(a.hash===hash)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});if(hash==='#comments')result();else if(hash==='#home')home();else if(hash==='#start')start();else if(hash==='#quiz')quiz();else if(hash==='#result')result();else if(hash==='#types')types();else if(hash.startsWith('#type/'))typeDetail(hash.split('/')[1]);else if(hash==='#board')result();else if(hash==='#stats')statisticsPage();else home();}
function needOnline(){if(!online){toast('데모 모드에서는 실시간 공유를 사용할 수 없어요.');return false;}return true;}
function confirmDialog(title,desc,label,fn){modal(`<h2>${title}</h2><p>${desc}</p><p id="modal-error" class="error" role="alert"></p><button class="btn danger" id="confirm">${label}</button>`);$('#confirm').onclick=e=>action(async()=>{await fn();$('#modal').close();render();},e.currentTarget);}
app.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.usual){state.usual=b.dataset.usual;save();start();return;}
 if(b.dataset.answer){state.answers[b.dataset.question]=b.dataset.answer;if(!b.dataset.question.startsWith('tie-')){const axis=QUESTIONS.find(q=>q.id===b.dataset.question).axis;delete state.answers[TIEBREAKERS[axis].id];}save();quiz();return;}
 if(b.dataset.vote){action(async()=>{await backend.vote(b.dataset.target,b.dataset.vote);toast('공감을 나눴어요. 선택은 언제든 바꿀 수 있어요.');},b);return;}
 switch(b.dataset.action){
 case 'delete-result-comment':if(!needOnline())break;if(window.confirm('이 댓글을 삭제하시겠습니까?'))action(async()=>{await backend.removeResult(b.dataset.target);toast('댓글을 삭제했어요.');},b);break;
 case 'automatic-share':shareAutomaticResult(b);break;
 case 'begin':state.started=true;save();go('#quiz');break;
 case 'previous':state.index=Math.max(0,state.index-1);save();quiz();$('#question-title')?.focus();break;
 case 'next':{const r=calculate(state.answers);const ties=AXES.filter(a=>QUESTIONS.filter(q=>q.axis===a).every(q=>state.answers[q.id])&&QUESTIONS.filter(q=>q.axis===a&&state.answers[q.id]===a[0]).length===6);const total=48+ties.length;if(state.index>=total-1&&r&&!r.ties.length){save();go('#result');}else{state.index=Math.min(state.index+1,total-1);save();quiz();$('#question-title')?.focus();}break;}
 case 'restart':confirmDialog('답변을 지우고 다시 시작할까요?','이 기기의 검사 답변만 초기화합니다. 이미 공유한 결과는 게시판에서 따로 수정하거나 삭제할 수 있어요.','처음부터 검사하기',async()=>{state.answers={};state.index=0;state.started=true;state.quoteIndex=Math.floor(Math.random()*3);save();go('#quiz');});break;
 case 'open-comments':openComments(b.dataset.target);break;
 case 'print':window.print();break;
 case 'edit-own':{const own=backend.entries.find(r=>r.uid===backend.user.uid);modal(`<h2>표시 이름 수정</h2><p>유형을 바꾸려면 재검사 후 결과 화면에서 다시 공유해 주세요.</p><form id="rename-form"><label class="form-field">이름 또는 별명<input name="name" maxlength="24" required value="${esc(own?.name)}"></label><p id="modal-error" class="error" role="alert"></p><button class="btn primary">수정하기</button></form>`);$('#rename-form').onsubmit=ev=>{ev.preventDefault();const name=new FormData(ev.target).get('name').trim();if(!name){errorBox('이름을 입력해 주세요.');return;}action(async()=>{await backend.rename(name);$('#modal').close();},ev.submitter);};break;}
 case 'delete-own':confirmDialog('공유한 결과를 삭제할까요?','개인 검사 결과는 이 기기에 남아 있어요. 다시 공유할 경우 공감 집계는 0부터 시작합니다.','내 공유 결과 삭제',()=>backend.removeOwn());break;
 }
});
$('#clear-local').onclick=()=>confirmDialog('이 기기의 검사 기록을 지울까요?','이 기기의 상세 응답과 검사 결과를 삭제합니다. 공개된 공유 결과를 지우려면 먼저 게시판에서 ‘내 공유 결과 삭제’를 눌러 주세요. 익명 인증 정보는 본인 게시글 관리에 필요하므로 유지됩니다.','검사 기록 지우기',async()=>{state={usual:'unknown',answers:{},index:0,started:false,quoteIndex:0};localStorage.removeItem(KEY);go('#home');});
window.addEventListener('hashchange',()=>{render();window.scrollTo({top:0,behavior:'instant'});app.focus({preventScroll:true});});
backend.onChange=()=>{if(commentTarget&&!backend.entries.some(r=>r.uid===commentTarget&&r.epoch===commentEpoch)){$('#modal').close();toast('이 결과가 삭제되었거나 새로 등록되었어요.');}if(['#result','#board','#comments'].includes(location.hash)){updateResultComments();return;}if(['#stats','#home'].includes(location.hash||'#home')){const active=document.activeElement;const pos=active?.id==='search'?active.selectionStart:null;render();if(pos!==null&&$('#search')){$('#search').focus();$('#search').setSelectionRange(pos,pos);}}};
backend.onError=e=>toast(message(e));
render();
if(window.FIREBASE_CONFIG){$('#mode').textContent='연결 중…';$('#mode-note').textContent='Firebase에 연결하는 중입니다. 개인 검사는 바로 시작할 수 있어요.';
 try{online=await backend.init(window.FIREBASE_CONFIG);if(!online)throw new Error('Firebase 공개 설정값을 확인해 주세요.');$('#mode').textContent='● 실시간 연결';$('#mode-note').textContent='모든 선생님이 결과 댓글에서 결과·댓글·공감을 실시간으로 나눌 수 있어요.';}
 catch(e){backend.stop();$('#mode').textContent='연결 오류 · 데모';$('#mode-note').textContent='Firebase 연결에 실패했습니다. 개인 검사는 가능하지만 공유·투표는 사용할 수 없습니다. README의 연결 절차와 네트워크를 확인해 주세요.';toast(message(e));}
 finally{render();}
}</script>
</body></html>
